<title>WOOTOPIAZ! — Mùa hạ tháng tám năm hai không một bảy.</title>
<style>
:root{--bg:#fff8fb;--paper:#fffdfd;--ink:#514451;--muted:#8c7b8c;--accent:#d9a9c2;--accent2:#d9e8d5;--line:#f0e1ea;--chip:#f8e5ed;--glow1:#f8e5ed;--glow2:#d9e8d5;--shadow:0 10px 30px #76506b12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--glow1) 72%,transparent),transparent 42%),radial-gradient(ellipse at 100% 18%,color-mix(in srgb,var(--glow2) 56%,transparent),transparent 38%),var(--bg);background-attachment:fixed;color:var(--ink);font:var(--base-size,16px)/1.6 var(--site-font,system-ui),-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background-color .25s,color .25s}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button{border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:650}button.secondary{background:var(--chip);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,92%);margin:auto}.topline{background:var(--paper);border-bottom:1px solid var(--line);font-size:12px;text-align:center;padding:7px;color:var(--muted)}header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}.brand{font-weight:950;letter-spacing:2px;font-size:clamp(22px,4vw,31px);line-height:1}.brand small{display:block;font-weight:450;letter-spacing:.1px;font-size:11px;color:var(--muted);margin-top:7px}.navlinks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.navlinks button{background:transparent;color:var(--ink);padding:8px 10px;font-size:13px}.navlinks button:hover,.navlinks button.active{background:var(--chip)}main{min-height:70vh;padding:30px 0 60px}.hero{padding:44px 25px;border-radius:28px;background:linear-gradient(130deg,var(--paper),var(--chip));border:1px solid var(--line);text-align:center;box-shadow:var(--shadow)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,6vw,52px);line-height:1.13;margin:10px 0}h2{font-size:clamp(22px,4vw,30px);line-height:1.2}h3{font-size:17px}.quote{font-family:Georgia,serif;font-style:italic;margin:20px auto;max-width:540px}.searchbar{display:flex;gap:8px;max-width:600px;margin:22px auto 0}.searchbar input,.field{width:100%;min-width:0;padding:12px 15px;border-radius:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}.section{margin-top:38px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}.sectionhead p{color:var(--muted);font-size:13px;margin:5px 0 0}.moods,.cards,.stats,.cols{display:grid;gap:14px}.moods{grid-template-columns:repeat(5,minmax(0,1fr))}.mood{padding:18px 13px;border-radius:20px;background:var(--paper);border:1px solid var(--line);text-align:left;color:var(--ink);min-height:120px;white-space:normal}.mood span{display:block;font-size:24px;margin-bottom:7px}.mood strong{display:block;line-height:1.3}.mood small{display:block;color:var(--muted);margin-top:7px;font-weight:400}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.story{overflow:hidden;border-radius:20px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}.cover{height:155px;display:grid;place-items:center;background:linear-gradient(135deg,var(--chip),var(--accent2));font-size:42px}.storybody{padding:15px}.storybody h3{margin-bottom:5px}.muted{color:var(--muted);font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--ink)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:8px 12px}.panel{padding:20px;border:1px solid var(--line);background:var(--paper);border-radius:22px;box-shadow:var(--shadow)}.cols{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{background:var(--paper);border:1px solid var(--line);padding:15px;border-radius:16px}.stat strong{font-size:22px;display:block}.pageintro{margin-bottom:24px}.pageintro p{color:var(--muted)}.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.listrow small{display:block;color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pillrow button{font-size:12px}.readertext{font:var(--base-size,16px)/var(--reader-line-height,1.8) var(--site-font,Georgia),serif;max-width:var(--reader-width,720px);margin:24px auto;white-space:pre-line;text-align:left;overflow-wrap:anywhere}.readerbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fieldlabel{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.fieldgroup{min-width:0}.wide{grid-column:1/-1}textarea.field{min-height:110px;resize:vertical}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:12px;text-align:center}.notice{font-size:12px;padding:12px 14px;background:var(--chip);border-radius:13px;margin:12px 0}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#4d414d;color:white;padding:10px 16px;border-radius:999px;z-index:10;box-shadow:var(--shadow);font-size:13px}
body[data-season="spring"]{--bg:#fff8fb;--paper:#fffdfd;--ink:#514451;--muted:#8c7b8c;--accent:#d9a9c2;--accent2:#d9e8d5;--line:#f0e1ea;--chip:#f8e5ed;--glow1:#f8e5ed;--glow2:#d9e8d5}
body[data-season="summer"]{--bg:#fffcf2;--paper:#fffefa;--ink:#554c3e;--muted:#8e8067;--accent:#d6b65e;--accent2:#d8e8dd;--line:#eee5cc;--chip:#f8edc9;--glow1:#f8edc9;--glow2:#d8e5f5}
body[data-season="autumn"]{--bg:#fff8f1;--paper:#fffdfa;--ink:#5b493f;--muted:#927a6c;--accent:#c78e70;--accent2:#d8dfcf;--line:#eddfd3;--chip:#f4e0d4;--glow1:#f4e0d4;--glow2:#e6d9e9}
body[data-season="winter"]{--bg:#fafbff;--paper:#fff;--ink:#49495d;--muted:#7f8099;--accent:#9ca6d4;--accent2:#d5e5f5;--line:#e4e5f3;--chip:#e5e5f7;--glow1:#e5e5f7;--glow2:#d5e5f5}
.seasonbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 0 12px}.seasonbar-label{font-size:12px;color:var(--muted);font-weight:650;margin-right:3px}.season-choice{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px 12px;font-size:12px;box-shadow:none}.season-choice.active{background:var(--chip);border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}.accessbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 0 12px;font-size:13px}.accessbar label{display:flex;align-items:center;gap:6px;color:var(--ink)}.accessbar input[type=range]{width:105px;accent-color:var(--accent);min-height:28px}.accessbar select{min-height:38px}.accessbar button{min-height:38px}.readerbar button,.readerbar select{min-height:42px}.readertext{padding:0 8px}.readertext p{margin-bottom:1.25em}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.accessbar select{max-width:160px;padding:7px 9px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}body[data-season="white"]{--bg:#fff;--paper:#fff;--ink:#222;--muted:#666;--accent:#777;--accent2:#eee;--line:#ddd;--chip:#f3f3f3;--glow1:#fff;--glow2:#fff}body[data-season="dark"]{--bg:#151515;--paper:#222;--ink:#f3f3f3;--muted:#c0c0c0;--accent:#8c8c8c;--accent2:#343434;--line:#444;--chip:#303030;--glow1:#151515;--glow2:#202020}body[data-season="dark"] .hero{background:linear-gradient(130deg,var(--paper),var(--chip))}body[data-season="dark"] button:not(.season-choice){color:var(--ink)}body[data-season="dark"] button:not(.secondary):not(.ghost){background:var(--chip)}
@media(max-width:760px){.nav{align-items:flex-start;flex-direction:column}.navlinks{justify-content:flex-start}.moods{grid-template-columns:repeat(2,minmax(0,1fr))}.mood:last-child{grid-column:1/-1}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:125px}.cols{grid-template-columns:1fr}.hero{padding:34px 17px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:430px){.cards{grid-template-columns:1fr}.cover{height:145px}.searchbar{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head>
<body data-season="spring"><div class="topline">Một góc nhỏ để tìm câu chuyện hợp với lòng mình ♡</div><header><div class="wrap nav"><a href="#home" class="brand">WOOTOPIAZ!<small>Mùa hạ tháng tám năm hai không một bảy.</small></a><nav class="navlinks" aria-label="Điều hướng"><button data-page="stories">Truyện</button><button data-page="week">Top tuần</button><button data-page="month">Top tháng</button><button data-page="ranking">Bảng xếp hạng</button><button data-page="library">Thư viện</button><button data-page="profile">Tài khoản</button></nav></div><div class="wrap seasonbar" aria-label="Chọn mùa giao diện"><span class="seasonbar-label">Màu của mùa:</span><button class="season-choice" data-season-choice="spring" onclick="setSeason('spring')">🌸 Xuân</button><button class="season-choice" data-season-choice="summer" onclick="setSeason('summer')">☀️ Hạ</button><button class="season-choice" data-season-choice="autumn" onclick="setSeason('autumn')">🍂 Thu</button><button class="season-choice" data-season-choice="winter" onclick="setSeason('winter')">❄️ Đông</button><button class="season-choice" data-season-choice="white" onclick="setSeason('white')">🤍 Trắng</button><button class="season-choice" data-season-choice="dark" onclick="setSeason('dark')">🌑 Đen</button></div><div class="wrap accessbar" aria-label="Tùy chỉnh khả năng đọc"><label for="siteFontSize">Cỡ chữ <strong id="fontSizeValue">16</strong></label><input id="siteFontSize" type="range" min="10" max="20" value="16" oninput="setFontSize(this.value)" aria-label="Cỡ chữ từ 10 đến 20 pixel"><label for="siteFont">Kiểu chữ</label><select id="siteFont" onchange="setFontFamily(this.value)" aria-label="Chọn kiểu chữ"><option value="system-ui">Mặc định dễ đọc</option><option value="Arial">Arial</option><option value="Verdana">Verdana</option><option value="Tahoma">Tahoma</option><option value="Georgia">Georgia</option></select><label for="lineSpacing">Giãn dòng</label><select id="lineSpacing" onchange="setLineSpacing(this.value)" aria-label="Khoảng cách dòng"><option value="1.5">Gọn</option><option value="1.8">Thoáng</option><option value="2">Rất thoáng</option></select></div></header><main class="wrap" id="app"></main><footer><div class="wrap">WOOTOPIAZ! · Hello, welcome to my WOOTOPIAZ World!<br>Đây là bộ khung thử nghiệm chạy trên trình duyệt. Dữ liệu mẫu và tính năng lưu hiện lưu trên thiết bị này.</div></footer><div id="toast" class="toast hidden" role="status"></div>
<script>
const sampleStories=[
{id:'s1',title:'Mối tình đầu vị kẹo quýt',author:'Mây Tháng Tám',status:'Đã hoàn thành',tags:['Thanh mai trúc mã','Chữa lành','HE'],emoji:'🍊',desc:'Một câu chuyện dịu dàng về những năm tháng lớn lên cạnh nhau và một lời yêu đến đúng lúc.',chapters:18,views:1280,hearts:246},
{id:'s2',title:'Ngày ấy chúng ta chưa biết buồn',author:'Nhà bên cửa sổ',status:'Đang viết',tags:['Học đường','Thanh xuân','HE'],emoji:'🎒',desc:'Mùa hè cuối cấp, trang lưu bút và những điều chưa kịp nói.',chapters:9,views:970,hearts:182},
{id:'s3',title:'Sau cơn mưa, trời vẫn xanh',author:'Lạc Lạc',status:'Đã hoàn thành',tags:['Chữa lành','Cứu rỗi','HE'],emoji:'🌦️',desc:'Hai người từng lạc lối học cách trở thành nơi bình yên của nhau.',chapters:24,views:2130,hearts:401},
{id:'s4',title:'Xin người đừng quay đầu',author:'Mực Tím',status:'Đã hoàn thành',tags:['Ngược tâm','SE','Trưởng thành'],emoji:'🥀',desc:'Có những cuộc chia tay không có người thắng, chỉ có người học cách bước tiếp.',chapters:15,views:3020,hearts:510},
{id:'s5',title:'Kế hoạch vả mặt trà xanh',author:'Hạt Dẻ',status:'Đang viết',tags:['Vả mặt trà xanh','Hài hước','Sảng văn'],emoji:'🫖',desc:'Một màn phản công gọn gàng, vui vẻ và không ai phải nuốt cục tức.',chapters:12,views:1780,hearts:320},
{id:'s6',title:'Kết hôn sau một cuộc gặp',author:'Tháng Năm',status:'Đang viết',tags:['Cưới trước yêu sau','Ngọt sủng'],emoji:'💌',desc:'Một bản hợp đồng tưởng như đơn giản bỗng có thêm rất nhiều điều khoản dịu dàng.',chapters:7,views:860,hearts:149}];
const moods=[['💗','Muốn yêu đương ngọt ngào.','Ngọt sủng, rung động, thanh mai trúc mã'],['🌷','Muốn được chữa lành.','Cứu rỗi nhau, dịu dàng, trưởng thành'],['🌧️','Muốn khóc một trận.','Ngược tâm, SE, BE và những chia ly'],['🕯️','Muốn cảm giác hồi hộp gay cấn.','Bí ẩn, tranh đấu, plot twist'],['🍵','Muốn đọc linh tinh vụn vặt.','Vả mặt trà xanh, hài hước, đủ vị']];
const allTags=['Thanh mai trúc mã','Học đường','Cưới trước yêu sau','Chữa lành','Trọng sinh','Vả mặt trà xanh','Ngược tâm','HE','SE','BE','Cứu rỗi','Hài hước','Sảng văn','Ngọt sủng'];
let state={page:'home',search:'',filter:'',selected:'s1',season:localStorage.getItem('wootopiaz-season')||'spring',fontSize:Number(localStorage.getItem('wootopiaz-font-size')||16),fontFamily:localStorage.getItem('wootopiaz-font-family')||'system-ui',lineSpacing:localStorage.getItem('wootopiaz-line-spacing')||'1.8',libraryTab:'saved',storyTab:'intro'};
const getSaved=()=>JSON.parse(localStorage.getItem('wootopiaz-saved')||'[]');const getAlbums=()=>JSON.parse(localStorage.getItem('wootopiaz-albums')||'[]');const setSaved=x=>localStorage.setItem('wootopiaz-saved',JSON.stringify(x));const setAlbums=x=>localStorage.setItem('wootopiaz-albums',JSON.stringify(x));const getStory=id=>sampleStories.find(s=>s.id===id)||sampleStories[0];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page,extra={}){state.page=page;Object.assign(state,extra);render();window.scrollTo({top:0,behavior:'smooth'})}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}function saveStory(id){let a=getSaved();if(a.includes(id)){toast('Truyện đã nằm trong mục Lưu nhanh rồi ♡');return}a.push(id);setSaved(a);toast('Đã Lưu nhanh truyện ♡');render()}function createAlbum(){let name=prompt('Đặt tên album của bé:');if(!name||!name.trim())return;let a=getAlbums();a.push({id:'a'+Date.now(),name:name.trim(),stories:[],private:true});setAlbums(a);toast('Đã tạo album riêng tư ♡');render()}function saveToAlbum(id){let albums=getAlbums();if(!albums.length){if(confirm('Bé chưa có album. Tạo album mới nhé?'))createAlbum();return}let choice=prompt('Nhập số album muốn lưu:\n'+albums.map((a,i)=>`${i+1}. ${a.name} (riêng tư)`).join('\n'));let n=Number(choice)-1;if(!Number.isInteger(n)||!albums[n])return; if(!albums[n].stories.includes(id))albums[n].stories.push(id);setAlbums(albums);toast('Đã lưu truyện vào album '+albums[n].name);render()}
function card(s){return `<article class="story"><div class="cover">${s.emoji}</div><div class="storybody"><h3>${esc(s.title)}</h3><div class="muted">${esc(s.author)} · ${s.status}</div><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="muted">${esc(s.desc)}</p><div class="muted">♡ ${s.hearts} · ◉ ${s.views} · ${s.chapters} chương</div><div class="actions"><button onclick="go('detail',{selected:'${s.id}'})">Xem truyện</button><button class="secondary" onclick="saveStory('${s.id}')">Lưu nhanh</button><button class="ghost" onclick="saveToAlbum('${s.id}')">+ Album</button></div></div></article>`}
function storyGrid(items){return items.length?`<div class="cards">${items.map(card).join('')}</div>`:`<div class="empty">Chưa có truyện ở đây. Bé có thể thử từ khóa khác nhé.</div>`}
function pageIntro(title,desc){return `<div class="pageintro"><div class="eyebrow">WOOTOPIAZ! · GÓC ĐỌC CỦA BÉ</div><h1>${title}</h1><p>${desc}</p></div>`}
function home(){return `<section class="hero"><div class="eyebrow">A little world of stories</div><h1>WOOTOPIAZ!</h1><p>Mùa hạ tháng tám năm hai không một bảy.</p><p class="quote">“Don’t be scared. It’s okay if you fall again.<br>When it’s hard, it’s okay to go rest for a bit.”<br><span class="muted">Compass || Golden Child</span></p><p>Hello, welcome to my WOOTOPIAZ World!</p><div class="searchbar"><input id="homeSearch" placeholder="Tìm tên truyện, motif, tác giả…" value="${esc(state.search)}"><button onclick="doSearch()">Tìm truyện</button></div></section><section class="section"><div class="sectionhead"><div><h2>Hôm nay bạn muốn đọc gì?</h2><p>Chọn tâm trạng, để WOOTOPIAZ! tìm câu chuyện hợp với bạn.</p></div></div><div class="moods">${moods.map((m,i)=>`<button class="mood" onclick="go('stories',{filter:'${['ngọt','chữa lành','SE','hồi hộp','vả mặt'][i]}'})"><span>${m[0]}</span><strong>${m[1]}</strong><small>${m[2]}</small></button>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>Những câu chuyện dành cho bạn</h2><p>Truyện mẫu để thử giao diện — chưa phải kho truyện thật.</p></div><button class="secondary" onclick="go('stories')">Xem tất cả</button></div>${storyGrid(sampleStories.slice(0,3))}</section><section class="section"><div class="sectionhead"><div><h2>Được đọc nhiều</h2><p>Bảng minh họa sắp xếp theo dữ liệu mẫu.</p></div><button class="ghost" onclick="go('ranking')">Bảng xếp hạng</button></div>${storyGrid([...sampleStories].sort((a,b)=>b.views-a.views).slice(0,3))}</section>`}
function storiesPage(){let q=state.search.toLowerCase(),f=state.filter.toLowerCase();let list=sampleStories.filter(s=>(!q||(s.title+' '+s.author+' '+s.tags.join(' ')).toLowerCase().includes(q))&&(!f||(s.tags.join(' ')+' '+s.desc+' '+s.title).toLowerCase().includes(f)));return `${pageIntro('Kho truyện','Tìm kiếm câu chuyện, tác giả hoặc motif yêu thích.')}<div class="panel"><div class="searchbar" style="margin:0"><input id="storySearch" placeholder="Thử: chữa lành, học đường…" value="${esc(state.search)}"><button onclick="doSearch('storySearch')">Tìm kiếm</button></div><div class="pillrow">${['Tất cả',...allTags].map(t=>`<button class="${state.filter===t?'':'secondary'}" onclick="go('stories',{filter:'${t==='Tất cả'?'':t}'})">${t}</button>`).join('')}</div></div><section class="section">${storyGrid(list)}</section>`}
function detailPage(){let s=getStory(state.selected);return `${pageIntro('Thông tin truyện','Một góc nhỏ để xem giới thiệu, review và danh sách chương.')}<div class="panel"><div class="cols"><div class="cover" style="height:230px;border-radius:18px">${s.emoji}</div><div><div class="eyebrow">${s.status}</div><h2>${esc(s.title)}</h2><p class="muted">Tác giả: ${esc(s.author)}</p><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p>${esc(s.desc)}</p><p class="muted">◉ ${s.views} lượt xem mẫu · ♡ ${s.hearts} lượt thích mẫu · ${s.chapters} chương</p><div class="actions"><button onclick="go('reader',{selected:'${s.id}'})">Bắt đầu đọc</button><button class="secondary" onclick="saveStory('${s.id}')">Lưu nhanh</button><button class="ghost" onclick="saveToAlbum('${s.id}')">Lưu vào album</button></div></div></div><div class="pillrow">${['intro','reviews','chapters'].map((t,i)=>`<button class="${state.storyTab===t?'':'secondary'}" onclick="state.storyTab='${t}';render()">${['Giới thiệu','Review','Danh sách chương'][i]}</button>`).join('')}</div><div>${state.storyTab==='intro'?`<p>${esc(s.desc)}</p><div class="notice">Đây là trang giao diện mẫu. Lượt xem, lượt thích và review chưa kết nối cơ sở dữ liệu.</div>`:state.storyTab==='reviews'?`<div class="empty">Chưa có review. Khi có backend, độc giả sẽ có thể gửi review riêng cho truyện.</div>`:`${Array.from({length:s.chapters},(_,i)=>`<div class="listrow"><div><strong>Chương ${i+1}</strong><small>${i===0?'Mở đầu câu chuyện':'Chương truyện mẫu'}</small></div><button class="secondary" onclick="go('reader',{selected:'${s.id}',chapter:${i+1}})">Đọc</button></div>`).join('')}`}</div></div>`}
function libraryPage(){let saved=getSaved(),albums=getAlbums();return `${pageIntro('Thư viện của bạn','Nơi gom những câu chuyện muốn đọc — riêng tư theo mặc định trên thiết bị này.')}<div class="panel"><div class="pillrow">${[['saved','Lưu nhanh / Đã lưu'],['albums','Album của tôi'],['reading','Đang đọc'],['read','Đã đọc']].map(([k,t])=>`<button class="${state.libraryTab===k?'':'secondary'}" onclick="state.libraryTab='${k}';render()">${t}</button>`).join('')}</div>${state.libraryTab==='saved'?storyGrid(sampleStories.filter(s=>saved.includes(s.id))):state.libraryTab==='albums'?`<div class="sectionhead"><div><h3>Album riêng tư</h3><p>Chỉ bạn xem được trên tài khoản/thiết bị này trong bản thử nghiệm.</p></div><button onclick="createAlbum()">+ Tạo album</button></div>${albums.length?albums.map(a=>`<div class="panel" style="margin:12px 0;box-shadow:none"><div class="listrow"><div><strong>📁 ${esc(a.name)}</strong><small>🔒 Riêng tư · ${a.stories.length} truyện</small></div><button class="secondary" onclick="openAlbum('${a.id}')">Mở album</button></div></div>`).join(''):`<div class="empty">Chưa có album nào. Tạo album đầu tiên của bé nhé ♡</div>`}`:state.libraryTab==='reading'?`<div class="empty">Chưa có tiến độ đọc. Khi có tài khoản và cơ sở dữ liệu, tiến độ sẽ được đồng bộ.</div>`:`<div class="empty">Mục truyện đã đọc sẽ xuất hiện ở đây khi tính năng được kết nối.</div>`}</div><div class="notice">Lưu ý: dữ liệu ở bản này lưu cục bộ trong trình duyệt. Chưa có tài khoản, đồng bộ giữa thiết bị hay bảo mật server.</div>`}
function openAlbum(id){let a=getAlbums().find(x=>x.id===id);if(!a)return;state.albumId=id;state.page='album';render()}
function albumPage(){let a=getAlbums().find(x=>x.id===state.albumId);if(!a)return libraryPage();return `${pageIntro('Album: '+esc(a.name),'Album riêng tư · ${a.stories.length} truyện'.replace('${a.stories.length}',a.stories.length))}<div class="panel"><div class="actions"><button class="secondary" onclick="renameAlbum('${a.id}')">Đổi tên</button><button class="ghost" onclick="shareAlbum('${a.id}')">${a.private?'Bật chia sẻ (demo)':'Tắt chia sẻ (demo)'}</button><button class="ghost" onclick="deleteAlbum('${a.id}')">Xóa album</button></div><div class="section">${storyGrid(sampleStories.filter(s=>a.stories.includes(s.id)))}</div><div class="notice">Chế độ chia sẻ hiện chỉ là giao diện minh họa, chưa tạo link chia sẻ thực tế.</div></div>`}
function renameAlbum(id){let a=getAlbums(),x=a.find(a=>a.id===id);if(!x)return;let n=prompt('Tên album mới:',x.name);if(n&&n.trim()){x.name=n.trim();setAlbums(a);render()}}function deleteAlbum(id){if(!confirm('Xóa album này? Truyện gốc không bị xóa.'))return;setAlbums(getAlbums().filter(a=>a.id!==id));go('library',{libraryTab:'albums'})}function shareAlbum(id){let a=getAlbums(),x=a.find(a=>a.id===id);if(!x)return;x.private=!x.private;setAlbums(a);toast('Đã đổi trạng thái minh họa');render()}
function readerPage(){let s=getStory(state.selected),ch=Number(state.chapter||1);return `${pageIntro(esc(s.title),'Chế độ đọc · Chương '+ch)}<div class="panel"><div class="readerbar"><button class="secondary" onclick="go('detail',{selected:'${s.id}'})">← Về trang truyện</button><select class="field" style="width:auto" onchange="go('reader',{selected:'${s.id}',chapter:Number(this.value)})">${Array.from({length:s.chapters},(_,i)=>`<option value="${i+1}" ${i+1===ch?'selected':''}>Chương ${i+1}</option>`).join('')}</select><button class="ghost" onclick="setFontSize(Math.min(20,state.fontSize+1));render()">A+</button><button class="ghost" onclick="setFontSize(Math.max(10,state.fontSize-1));render()">A−</button></div><article class="readertext">Chương ${ch}\n\nĐây là phần văn bản mẫu của WOOTOPIAZ!. Khi website kết nối với kho dữ liệu, nội dung chương thật sẽ được hiển thị ở đây.\n\nHãy tưởng tượng một buổi chiều tháng tám, nắng nằm yên trên bậu cửa sổ và một câu chuyện đang chờ được mở ra.\n\nBé có thể đổi cỡ chữ, kiểu chữ và khoảng cách dòng để tìm cảm giác đọc thoải mái nhất. Phần lưu tiến độ, ghi chú, đánh dấu và bình luận chương sẽ được triển khai ở bước tiếp theo.</article><div class="readerbar"><button class="secondary" ${ch<=1?'disabled':''} onclick="go('reader',{selected:'${s.id}',chapter:${Math.max(1,ch-1)}})">Chương trước</button><button onclick="go('reader',{selected:'${s.id}',chapter:${Math.min(s.chapters,ch+1)}})">Chương tiếp theo →</button></div></div>`}
function rankingPage(kind){let title=kind==='week'?'Top tuần':kind==='month'?'Top tháng':'Bảng xếp hạng';return `${pageIntro(title,'Bảng dưới đây dùng dữ liệu mẫu để dựng giao diện. Chưa phải thứ hạng thực tế.')}<div class="panel">${[...sampleStories].sort((a,b)=>b.views-a.views).map((s,i)=>`<div class="listrow"><div style="display:flex;gap:13px;align-items:center"><strong style="font-size:24px;color:var(--accent)">${i===0?'👑':i+1}</strong><div><strong>${esc(s.title)}</strong><small>${esc(s.author)} · ${s.tags.slice(0,2).join(' · ')}</small></div></div><div style="text-align:right"><strong>${s.views}</strong><small class="muted">lượt xem mẫu</small></div></div>`).join('')}</div>`}
function profilePage(){return `${pageIntro('Tài khoản độc giả','Bộ khung cho hồ sơ, đăng nhập và cài đặt cá nhân.')}<div class="cols"><div class="panel"><h2>Chào mừng đến WOOTOPIAZ!</h2><p>Đăng nhập và đăng ký sẽ được kết nối sau khi có hệ thống tài khoản an toàn.</p><button onclick="toast('Đăng nhập chưa được kết nối trong bản khung')">Đăng nhập</button> <button class="secondary" onclick="toast('Đăng ký chưa được kết nối trong bản khung')">Tạo tài khoản</button><div class="notice">Không nhập mật khẩu thật ở bản demo này.</div></div><div class="panel"><h2>Giao diện & mùa</h2><label class="fieldlabel" for="season">Chọn mùa cho toàn website</label><select id="season" class="field" onchange="setSeason(this.value)"><option value="spring" ${state.season==='spring'?'selected':''}>🌸 Xuân — hồng phấn</option><option value="summer" ${state.season==='summer'?'selected':''}>☀️ Hạ — vàng bơ</option><option value="autumn" ${state.season==='autumn'?'selected':''}>🍂 Thu — đào bụi</option><option value="winter" ${state.season==='winter'?'selected':''}>❄️ Đông — xanh băng / lavender</option><option value="white" ${state.season==='white'?'selected':''}>🤍 Trắng cơ bản</option><option value="dark" ${state.season==='dark'?'selected':''}>🌑 Đen / tối</option></select><p class="muted" style="margin-top:12px">Màu giao diện, cỡ chữ và font chữ được lưu trên trình duyệt hiện tại.</p></div></div>`}
function ownerPage(){return `${pageIntro('Owner Studio','Khu quản trị được dựng khung giao diện, chưa được khóa bằng đăng nhập server. Không đưa lên mạng công khai như một trang quản trị thật trước khi bổ sung bảo mật.')}<div class="stats"><div class="stat"><strong>06</strong><span class="muted">Truyện mẫu</span></div><div class="stat"><strong>14</strong><span class="muted">Motif mẫu</span></div><div class="stat"><strong>04</strong><span class="muted">Mùa giao diện</span></div></div><div class="cols section"><div class="panel"><h3>Quản lý truyện & chương</h3><p class="muted">Tạo, sửa, lưu nháp và xuất bản sẽ cần cơ sở dữ liệu.</p><button class="secondary" onclick="toast('Quản lý nội dung chưa kết nối')">Mở quản lý</button></div><div class="panel"><h3>Pastel Tag Studio</h3><p class="muted">Bộ khung nhóm motif, trạng thái và màu sắc.</p><div class="tags">${allTags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="panel"><h3>Theme Studio</h3><p class="muted">Chọn mùa và xem màu toàn trang thay đổi.</p><button class="secondary" onclick="go('profile')">Mở cài đặt mùa</button></div><div class="panel"><h3>Riêng tư & bảo mật</h3><p class="muted">Khóa toàn site, khóa truyện/chương, phân quyền owner cần kiểm tra server trước khi dùng thật.</p><span class="tag">Chưa triển khai</span></div></div>`}
function setSeason(s){if(!['spring','summer','autumn','winter','white','dark'].includes(s))return;state.season=s;document.body.dataset.season=s;try{localStorage.setItem('wootopiaz-season',s)}catch(e){}document.querySelectorAll('[data-season-choice]').forEach(b=>{const active=b.dataset.seasonChoice===s;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const select=document.getElementById('season');if(select)select.value=s;toast(s==='white'?'Đã chuyển sang nền trắng ♡':s==='dark'?'Đã chuyển sang nền tối ♡':'Đã đổi màu nền theo mùa ♡')}
function setFontSize(value){let n=Math.max(10,Math.min(20,Number(value)||16));state.fontSize=n;document.documentElement.style.setProperty('--base-size',n+'px');let label=document.getElementById('fontSizeValue');if(label)label.textContent=n;try{localStorage.setItem('wootopiaz-font-size',String(n))}catch(e){}}
function setFontFamily(value){const allowed=['system-ui','Arial','Verdana','Tahoma','Georgia'];if(!allowed.includes(value))return;state.fontFamily=value;document.documentElement.style.setProperty('--site-font',value);const select=document.getElementById('siteFont');if(select)select.value=value;try{localStorage.setItem('wootopiaz-font-family',value)}catch(e){}}
function setLineSpacing(value){const allowed=['1.5','1.8','2'];if(!allowed.includes(String(value)))return;state.lineSpacing=String(value);document.documentElement.style.setProperty('--reader-line-height',state.lineSpacing);const select=document.getElementById('lineSpacing');if(select)select.value=state.lineSpacing;try{localStorage.setItem('wootopiaz-line-spacing',state.lineSpacing)}catch(e){}}
function doSearch(id='homeSearch'){let el=document.getElementById(id);state.search=el?el.value:'';state.filter='';go('stories')}
function render(){document.body.dataset.season=state.season;setFontSize(state.fontSize);setFontFamily(state.fontFamily);setLineSpacing(state.lineSpacing);document.querySelectorAll('[data-season-choice]').forEach(b=>{const active=b.dataset.seasonChoice===state.season;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));let app=document.getElementById('app');const pages={home,stories:storiesPage,detail:detailPage,library:libraryPage,album:albumPage,reader:readerPage,week:()=>rankingPage('week'),month:()=>rankingPage('month'),ranking:()=>rankingPage('all'),profile:profilePage,owner:ownerPage};app.innerHTML=(pages[state.page]||home)();}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p)go(p)});render();
</script></body></html>
